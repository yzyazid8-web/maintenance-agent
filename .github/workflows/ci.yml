name: CI

# Déclencheurs : à chaque push sur main et à chaque pull request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1 Qualité : lint + format + tests. Casser tot, casser petit.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typage (mypy)
        run: mypy src

      - name: Tests (pytest + couverture)
        run: pytest -q --cov=src --cov-report=term-missing

  # 2 Build Docker + SMOKE TEST : ne tourne que si "quality" passe. Prouve que « ça se lance
  #   en une commande » (on ne se contente pas de builder l'image, on la démarre).
  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t maintenance-agent:ci .
      - name: Smoke test (le conteneur démarre et sert le dashboard)
        run: |
          docker run -d -p 7860:7860 --name mapp maintenance-agent:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:7860 >/dev/null && { echo "OK après $((i*3))s"; break; }
            sleep 3
          done
          if ! curl -fsS http://localhost:7860 >/dev/null; then
            echo "ÉCHEC : le conteneur ne répond pas sur :7860"; docker logs mapp; docker rm -f mapp; exit 1
          fi
          docker rm -f mapp
