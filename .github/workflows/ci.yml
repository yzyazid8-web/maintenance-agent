name: CI

# Déclencheurs : à chaque push sur main et à chaque pull request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1 Qualité : lint + format + tests. Casser tot, casser petit.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Tests (pytest + couverture)
        run: pytest -q --cov=src --cov-report=term-missing

  # 2 Build Docker : ne tourne que si "quality" passe. Détecte un Dockerfile cassé avant la prod.
  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke test)
        run: docker build -t maintenance-agent:ci .
