[project]
name = "maintenance-agent"
version = "0.1.0"
description = "Agent de maintenance prédictive (XGBoost + marimo + agent LLM)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 : la longueur de ligne est gérée par le formateur (ruff format).
# B018 : les sorties de cellules marimo (dernière expression) sont intentionnelles.
ignore = ["E501", "B018"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
